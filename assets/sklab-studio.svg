<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="sklab-title sklab-desc">
  <title id="sklab-title">SKLab Studio</title>
  <desc id="sklab-desc">SKLab Studio — build agents, verify outcomes.</desc>
  <style>
    .mark-box { fill: none; stroke: #111111; stroke-width: 2.5; }
    .mark-glyph { fill: #111111; font-family: SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace; font-size: 30px; font-weight: 600; }
    .mark-dot { fill: #111111; }
    .wordmark { fill: #111111; font-family: Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; font-size: 68px; font-weight: 650; letter-spacing: -1.5px; }
    .sub { fill: #6B7280; font-family: Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; font-size: 23px; font-weight: 400; letter-spacing: 0.2px; }
    .rule { stroke: #E5E7EB; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .mark-box { stroke: #FAFAFA; }
      .mark-glyph { fill: #FAFAFA; }
      .mark-dot { fill: #FAFAFA; }
      .wordmark { fill: #FAFAFA; }
      .sub { fill: #A1A1AA; }
      .rule { stroke: #27272A; }
    }
  </style>

  <!-- mark, centered above wordmark -->
  <g transform="translate(600, 88)">
    <rect class="mark-box" x="-36" y="-36" width="72" height="72" rx="16"/>
    <text class="mark-glyph" x="0" y="10" text-anchor="middle">&#62;_</text>
    <circle class="mark-dot" cx="26" cy="-26" r="4"/>
  </g>

  <!-- wordmark -->
  <text class="wordmark" x="600" y="210" text-anchor="middle">SKLab Studio</text>

  <!-- subtitle -->
  <text class="sub" x="600" y="252" text-anchor="middle">Build agents. Verify outcomes.</text>

  <!-- subtle rule -->
  <line class="rule" x1="520" y1="286" x2="680" y2="286"/>
</svg>
